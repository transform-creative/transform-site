# Monthly ACNC snapshot -> Supabase (Transform Creative warm-lead radar)
#
# The scripts live in dump/acnc-radar-v2/ (every run step uses that as its working directory).
#
# Setup (once):
#   1. This file must be on the default branch (main) for "Run workflow" and the schedule to work.
#   2. Settings > Secrets and variables > Actions > New repository secret:
#        SUPABASE_DB_URL = the *Session pooler* connection string from Supabase (Project > Connect)
#   3. Actions tab > "ACNC monthly snapshot" > Run workflow, to test it straight away.
#
# Runs automatically early on the 2nd of each month, Adelaide time.

name: ACNC monthly snapshot

on:
  schedule:
    - cron: "13 19 1 * *"   # 19:13 UTC on the 1st = early morning on the 2nd in Adelaide
  workflow_dispatch:
    inputs:
      snapshot_month:
        description: "Snapshot month (YYYY-MM). Leave blank for this month."
        required: false

concurrency:
  group: acnc-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dump/acnc-radar-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dump/acnc-radar-v2/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Download latest ACNC files
        id: fetch
        run: python fetch_acnc.py >> "$GITHUB_OUTPUT"

      - name: Extract and flag
        env:
          MONTH: ${{ inputs.snapshot_month }}
        run: |
          MONTH="${MONTH:-$(date -u +%Y-%m)}"
          PREV=()
          if [ -n "${{ steps.fetch.outputs.AIS_PREV }}" ]; then PREV=(--ais-prev "${{ steps.fetch.outputs.AIS_PREV }}"); fi
          python acnc_extract.py \
            --register "${{ steps.fetch.outputs.REGISTER }}" \
            --ais "${{ steps.fetch.outputs.AIS }}" \
            "${PREV[@]}" \
            --snapshot-month "$MONTH" \
            --out orgs.csv | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Load into Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python load_supabase.py orgs.csv | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy of the CSV (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orgs-csv
          path: dump/acnc-radar-v2/orgs.csv
          retention-days: 30
          if-no-files-found: ignore
